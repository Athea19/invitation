<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jerome & Liezl | Wedding Invitation</title>


    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #fce8ef;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        body {
            position: relative;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #fffafb 0%,
                    #fdebf1 45%,
                    #f6cbd9 100%
                );

            z-index: -10;
        }


        /* =====================================================
           OPENING SCREEN
        ===================================================== */

        #opening {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #fff9fb,
                    #f8d6e2,
                    #fff4f7
                );

            z-index: 1000;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }


        #opening.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .opening-content {

            animation:
                entrance 2s ease forwards;
        }


        .opening-flower {

            font-size: 55px;

            margin-bottom: 15px;

            animation:
                flowerFloat 3s ease-in-out infinite;
        }


        .opening-small {

            color: #8d5061;

            letter-spacing: 5px;

            font-size: 12px;

            margin-bottom: 12px;
        }


        .opening-name {

            margin: 0;

            color: #70263c;

            font-size:
                clamp(45px, 10vw, 75px);

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-weight: normal;

            text-shadow:
                0 3px 15px
                rgba(112, 38, 60, 0.15);
        }


        .opening-and {

            color: #9b5b6c;

            font-size: 22px;

            margin: 8px 0;
        }


        .opening-subtitle {

            color: #784252;

            letter-spacing: 4px;

            font-size: 13px;

            margin-top: 18px;
        }


        .opening-line {

            width: 170px;

            height: 1px;

            margin: 22px auto;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #9b5b6c,
                    transparent
                );
        }


        /* =====================================================
           OPEN BUTTON
        ===================================================== */

        .open-button {

            position: relative;

            margin-top: 20px;

            padding: 16px 35px;

            border: 1px solid #8b4054;

            border-radius: 40px;

            background: #8b4054;

            color: white;

            font-size: 14px;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 10px 35px
                rgba(108, 40, 61, 0.3);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }


        .open-button:hover {

            transform:
                translateY(-5px)
                scale(1.05);

            box-shadow:
                0 15px 45px
                rgba(108, 40, 61, 0.4);
        }


        .open-button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.5),
                    transparent
                );

            transform: skewX(-20deg);

            animation:
                buttonShine 3s infinite;
        }


        /* =====================================================
           INVITATION AREA
        ===================================================== */

        .invitation {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            perspective: 1600px;
        }


        /* =====================================================
           PAGES
        ===================================================== */

        .page {

            position: absolute;

            width: min(95vw, 650px);

            height: 94vh;

            display: flex;

            justify-content: center;

            align-items: center;

            opacity: 0;

            visibility: hidden;

            transform:
                translateX(100px)
                rotateY(-20deg)
                scale(0.92);

            filter: blur(8px);

            transition:
                opacity 1s ease,
                transform 1.1s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),
                filter 1s ease,
                visibility 1s;
        }


        .page.active {

            opacity: 1;

            visibility: visible;

            transform:
                translateX(0)
                rotateY(0deg)
                scale(1);

            filter: blur(0);

            z-index: 10;
        }


        /* =====================================================
           INVITATION IMAGES
        ===================================================== */

        .page img {

            max-width: 100%;

            max-height: 93vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 5px;

            box-shadow:
                0 25px 70px
                rgba(82, 31, 48, 0.30);

            animation:
                imageBreath 7s ease-in-out infinite;
        }


        /* =====================================================
           PAGE TRANSITION FLASH
        ===================================================== */

        .page-flash {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.8),
                    transparent 65%
                );

            pointer-events: none;

            opacity: 0;

            z-index: 500;
        }


        .page-flash.active {

            animation:
                flash 1s ease;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {

            position: fixed;

            left: 50%;

            bottom: 22px;

            transform:
                translateX(-50%);

            display: none;

            align-items: center;

            gap: 13px;

            padding: 9px 13px;

            border-radius: 50px;

            background:
                rgba(255,255,255,0.88);

            box-shadow:
                0 8px 35px
                rgba(90, 32, 50, 0.2);

            backdrop-filter: blur(12px);

            z-index: 300;
        }


        .navigation button {

            width: 43px;

            height: 43px;

            border: none;

            border-radius: 50%;

            background: #8b4054;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        .navigation button:hover {

            transform: scale(1.12);

            background: #6d263b;
        }


        .navigation button:disabled {

            opacity: 0.35;

            cursor: default;

            transform: none;
        }


        .page-number {

            min-width: 52px;

            text-align: center;

            color: #713849;

            font-size: 13px;

            letter-spacing: 1px;
        }


        /* =====================================================
           MUSIC BUTTON
        ===================================================== */

        .music-button {

            position: fixed;

            top: 20px;

            right: 20px;

            width: 48px;

            height: 48px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.9);

            color: #7b354b;

            font-size: 20px;

            cursor: pointer;

            box-shadow:
                0 6px 25px
                rgba(80,30,45,0.2);

            z-index: 400;

            display: none;

            transition:
                transform 0.3s ease;
        }


        .music-button:hover {

            transform: scale(1.1);
        }


        /* =====================================================
           FLOATING PETALS
        ===================================================== */

        .petals {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 200;
        }


        .petal {

            position: absolute;

            top: -40px;

            opacity: 0;

            animation:
                falling linear infinite;
        }


        .petal:nth-child(1) {

            left: 5%;

            font-size: 17px;

            animation-duration: 8s;

            animation-delay: 0s;
        }


        .petal:nth-child(2) {

            left: 18%;

            font-size: 13px;

            animation-duration: 11s;

            animation-delay: 3s;
        }


        .petal:nth-child(3) {

            left: 35%;

            font-size: 20px;

            animation-duration: 9s;

            animation-delay: 1s;
        }


        .petal:nth-child(4) {

            left: 53%;

            font-size: 15px;

            animation-duration: 12s;

            animation-delay: 5s;
        }


        .petal:nth-child(5) {

            left: 70%;

            font-size: 19px;

            animation-duration: 8s;

            animation-delay: 2s;
        }


        .petal:nth-child(6) {

            left: 87%;

            font-size: 14px;

            animation-duration: 10s;

            animation-delay: 4s;
        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        .sparkle {

            position: fixed;

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 12px white,
                0 0 22px #f4a8bd;

            pointer-events: none;

            opacity: 0;

            z-index: 150;

            animation:
                sparkleAnimation 4s ease-in-out infinite;
        }


        .sparkle.one {

            top: 18%;

            left: 15%;

            animation-delay: 0s;
        }


        .sparkle.two {

            top: 30%;

            right: 13%;

            animation-delay: 1.5s;
        }


        .sparkle.three {

            bottom: 25%;

            left: 10%;

            animation-delay: 2.5s;
        }


        .sparkle.four {

            bottom: 15%;

            right: 17%;

            animation-delay: 0.8s;
        }


        /* =====================================================
           FINAL "YOU'RE INVITED" PAGE
        ===================================================== */

        .final-page {

            text-align: center;

            justify-content: center;

            align-items: center;
        }


        .final-card {

            width: min(90vw, 560px);

            min-height: 75vh;

            padding: 60px 35px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            border-radius: 8px;

            background:
                radial-gradient(
                    circle at center,
                    #fffdfd 0%,
                    #fff4f7 60%,
                    #fbd9e5 100%
                );

            box-shadow:
                0 25px 70px
                rgba(82, 31, 48, 0.25);

            border:
                1px solid
                rgba(139, 64, 84, 0.15);

            position: relative;

            overflow: hidden;
        }


        .final-card::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                rgba(255, 190, 210, 0.22);

            top: -150px;

            left: -100px;
        }


        .final-card::after {

            content: "";

            position: absolute;

            width: 250px;

            height: 250px;

            border-radius: 50%;

            background:
                rgba(255, 210, 225, 0.25);

            bottom: -120px;

            right: -100px;
        }


        .final-flower {

            font-size: 50px;

            margin-bottom: 20px;

            animation:
                flowerFloat 3s ease-in-out infinite;
        }


        .final-small {

            margin: 0 0 12px;

            color: #956071;

            font-size: 11px;

            letter-spacing: 4px;
        }


        .final-card h1 {

            margin: 0;

            color: #70263c;

            font-size:
                clamp(48px, 9vw, 75px);

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-weight: normal;

            text-shadow:
                0 4px 20px
                rgba(112, 38, 60, 0.15);

            animation:
                finalTitle 1.5s ease forwards;
        }


        .final-divider {

            margin: 20px 0;

            color: #9b5b6c;

            font-size: 20px;

            animation:
                sparkleAnimation 3s ease-in-out infinite;
        }


        .final-message {

            color: #714250;

            font-size: 16px;

            line-height: 1.8;

            margin: 0;
        }


        .final-names {

            margin-top: 30px;

            color: #70263c;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-size: 35px;
        }


        .final-date {

            margin-top: 18px;

            color: #8b4054;

            font-size: 12px;

            letter-spacing: 4px;
        }


        .final-hearts {

            margin-top: 22px;

            color: #b35d75;

            font-size: 18px;

            letter-spacing: 3px;
        }


        .final-flower-bottom {

            margin-top: 25px;

            font-size: 35px;

            animation:
                flowerFloat 3.5s ease-in-out infinite reverse;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes entrance {

            0% {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.9);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes flowerFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-4deg);
            }

            50% {

                transform:
                    translateY(-12px)
                    rotate(4deg);
            }
        }


        @keyframes buttonShine {

            0% {

                left: -100%;
            }

            45%,
            100% {

                left: 150%;
            }
        }


        @keyframes imageBreath {

            0%,
            100% {

                transform: scale(1);
            }

            50% {

                transform: scale(1.012);
            }
        }


        @keyframes flash {

            0% {

                opacity: 0;
            }

            35% {

                opacity: 1;
            }

            100% {

                opacity: 0;
            }
        }


        @keyframes falling {

            0% {

                transform:
                    translateY(-50px)
                    translateX(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {

                opacity: 0.75;
            }

            50% {

                transform:
                    translateY(50vh)
                    translateX(70px)
                    rotate(180deg);
            }

            90% {

                opacity: 0.6;
            }

            100% {

                transform:
                    translateY(110vh)
                    translateX(-40px)
                    rotate(360deg);

                opacity: 0;
            }
        }


        @keyframes sparkleAnimation {

            0%,
            100% {

                opacity: 0;

                transform:
                    scale(0.4);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.5);
            }
        }


        @keyframes finalTitle {

            0% {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.9);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {

                width: 97vw;

                height: 91vh;
            }


            .page img {

                max-width: 96vw;

                max-height: 89vh;
            }


            .opening-name {

                font-size: 52px;
            }


            .opening-subtitle {

                font-size: 11px;

                letter-spacing: 3px;
            }


            .navigation {

                bottom: 12px;
            }


            .music-button {

                top: 12px;

                right: 12px;

                width: 43px;

                height: 43px;
            }


            .final-card {

                min-height: 78vh;

                padding:
                    45px 25px;
            }


            .final-card h1 {

                font-size: 55px;
            }


            .final-message {

                font-size: 14px;
            }


            .final-names {

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="weddingMusic"
    loop
    preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     FLOATING PETALS
===================================================== -->

<div class="petals">

    <div class="petal">🌸</div>

    <div class="petal">🌷</div>

    <div class="petal">🌸</div>

    <div class="petal">🌷</div>

    <div class="petal">🌸</div>

    <div class="petal">🌷</div>

</div>


<!-- =====================================================
     SPARKLES
===================================================== -->

<div class="sparkle one"></div>

<div class="sparkle two"></div>

<div class="sparkle three"></div>

<div class="sparkle four"></div>


<!-- =====================================================
     PAGE TRANSITION FLASH
===================================================== -->

<div
    class="page-flash"
    id="pageFlash">
</div>


<!-- =====================================================
     OPENING SCREEN
===================================================== -->

<section id="opening">

    <div class="opening-content">

        <div class="opening-flower">
            🌸
        </div>


        <div class="opening-small">
            TOGETHER WITH THEIR FAMILIES
        </div>


        <h1 class="opening-name">
            Jerome
        </h1>


        <div class="opening-and">
            &
        </div>


        <h1 class="opening-name">
            Liezl
        </h1>


        <div class="opening-line"></div>


        <div class="opening-subtitle">
            WEDDING INVITATION
        </div>


        <button
            class="open-button"
            onclick="openInvitation()">

            💌 &nbsp; OPEN INVITATION

        </button>

    </div>

</section>


<!-- =====================================================
     INVITATION PAGES
===================================================== -->

<main class="invitation">


    <!-- =================================================
         PAGE 1
    ================================================== -->

    <section
        class="page active"
        id="page1">

        <img
            src="page1.png"
            alt="Jerome and Liezl Wedding Invitation">

    </section>


    <!-- =================================================
         PAGE 2
    ================================================== -->

    <section
        class="page"
        id="page2">

        <img
            src="page2.png"
            alt="Jerome and Liezl">

    </section>


    <!-- =================================================
         PAGE 3
    ================================================== -->

    <section
        class="page"
        id="page3">

        <img
            src="page3.png"
            alt="Principal Sponsors">

    </section>


    <!-- =================================================
         PAGE 4
    ================================================== -->

    <section
        class="page"
        id="page4">

        <img
            src="page4.png"
            alt="Secondary Sponsors">

    </section>


    <!-- =================================================
         PAGE 5 - FINAL
    ================================================== -->

    <section
        class="page final-page"
        id="page5">


        <div class="final-card">


            <div class="final-flower">
                🌸
            </div>


            <p class="final-small">
                WITH LOVE AND JOY
            </p>


            <h1>
                You're Invited
            </h1>


            <div class="final-divider">
                ✦
            </div>


            <p class="final-message">

                We would be delighted<br>

                to have you celebrate<br>

                this beautiful day with us.

            </p>


            <div class="final-names">
                Jerome & Liezl
            </div>


            <p class="final-date">
                SEPTEMBER 25
            </p>


            <div class="final-hearts">
                ♡ &nbsp; ♡ &nbsp; ♡
            </div>


            <div class="final-flower-bottom">
                🌷
            </div>


        </div>


    </section>


</main>


<!-- =====================================================
     MUSIC BUTTON
===================================================== -->

<button
    class="music-button"
    id="musicButton"
    onclick="toggleMusic()">

    🔊

</button>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<div
    class="navigation"
    id="navigation">


    <button
        id="previousButton"
        onclick="previousPage()">

        ←

    </button>


    <div
        class="page-number"
        id="pageNumber">

        1 / 5

    </div>


    <button
        id="nextButton"
        onclick="nextPage()">

        →

    </button>


</div>


<script>


    /* =====================================================
       SETTINGS
    ===================================================== */

    let currentPage = 1;

    const totalPages = 5;


    const music =
        document.getElementById(
            "weddingMusic"
        );


    const musicButton =
        document.getElementById(
            "musicButton"
        );


    /* =====================================================
       TRY AUTOMATIC MUSIC
    ===================================================== */

    window.addEventListener(
        "load",
        function() {

            music.volume = 0.45;


            /*
                Try to automatically play.

                IMPORTANT:
                Some browsers block autoplay
                until the visitor interacts.
            */

            music.play()

                .then(function() {

                    musicButton.innerHTML =
                        "🔊";

                })

                .catch(function() {

                    musicButton.innerHTML =
                        "🔇";

                });

        }
    );


    /* =====================================================
       OPEN INVITATION
    ===================================================== */

    function openInvitation() {


        const opening =
            document.getElementById(
                "opening"
            );


        const navigation =
            document.getElementById(
                "navigation"
            );


        opening.classList.add(
            "hide"
        );


        navigation.style.display =
            "flex";


        musicButton.style.display =
            "block";


        /*
            Because the visitor clicked
            the button, the browser should
            allow the music to start.
        */

        music.play()

            .then(function() {

                musicButton.innerHTML =
                    "🔊";

            })

            .catch(function() {

                musicButton.innerHTML =
                    "🔇";

            });


        flashPage();

    }


    /* =====================================================
       SHOW PAGE
    ===================================================== */

    function showPage(pageNumber) {


        const pages =
            document.querySelectorAll(
                ".page"
            );


        pages.forEach(function(page) {

            page.classList.remove(
                "active"
            );

        });


        const selectedPage =
            document.getElementById(
                "page" + pageNumber
            );


        setTimeout(
            function() {

                selectedPage.classList.add(
                    "active"
                );

            },
            80
        );


        currentPage =
            pageNumber;


        document.getElementById(
            "pageNumber"
        ).innerHTML =
            pageNumber +
            " / " +
            totalPages;


        updateButtons();


        flashPage();

    }


    /* =====================================================
       NEXT PAGE
    ===================================================== */

    function nextPage() {

        if (
            currentPage <
            totalPages
        ) {

            showPage(
                currentPage + 1
            );

        }

    }


    /* =====================================================
       PREVIOUS PAGE
    ===================================================== */

    function previousPage() {

        if (
            currentPage >
            1
        ) {

            showPage(
                currentPage - 1
            );

        }

    }


    /* =====================================================
       BUTTON STATES
    ===================================================== */

    function updateButtons() {


        const previous =
            document.getElementById(
                "previousButton"
            );


        const next =
            document.getElementById(
                "nextButton"
            );


        previous.disabled =
            currentPage === 1;


        next.disabled =
            currentPage === totalPages;

    }


    /* =====================================================
       PAGE FLASH
    ===================================================== */

    function flashPage() {


        const flash =
            document.getElementById(
                "pageFlash"
            );


        flash.classList.remove(
            "active"
        );


        /*
            Force animation to restart.
        */

        void flash.offsetWidth;


        flash.classList.add(
            "active"
        );

    }


    /* =====================================================
       MUSIC ON / OFF
    ===================================================== */

    function toggleMusic() {


        if (
            music.paused
        ) {

            music.play();

            musicButton.innerHTML =
                "🔊";

        }

        else {

            music.pause();

            musicButton.innerHTML =
                "🔇";

        }

    }


    /* =====================================================
       KEYBOARD NAVIGATION
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {


            if (
                event.key ===
                "ArrowRight"
            ) {

                nextPage();

            }


            if (
                event.key ===
                "ArrowLeft"
            ) {

                previousPage();

            }

        }
    );


    /* =====================================================
       PHONE SWIPE
    ===================================================== */

    let touchStartX = 0;

    let touchEndX = 0;


    document.addEventListener(
        "touchstart",
        function(event) {

            touchStartX =
                event.changedTouches[0]
                    .screenX;

        }
    );


    document.addEventListener(
        "touchend",
        function(event) {

            touchEndX =
                event.changedTouches[0]
                    .screenX;


            handleSwipe();

        }
    );


    function handleSwipe() {


        const difference =
            touchStartX -
            touchEndX;


        /*
            Swipe left:
            NEXT PAGE
        */

        if (
            difference > 50
        ) {

            nextPage();

        }


        /*
            Swipe right:
            PREVIOUS PAGE
        */

        if (
            difference < -50
        ) {

            previousPage();

        }

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    updateButtons();


</script>


</body>

</html>
